services:
  bot:
    image: youtube-shorts-bot:latest
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - type=local,src=.docker-cache
      cache_to:
        - type=local,dest=.docker-cache,mode=max
    container_name: youtube-shorts-bot
    init: true
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./downloads
        target: /app/downloads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
